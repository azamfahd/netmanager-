name: Build and Export Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dapple.awt.UIElement=true"
  GRADLE_OPTS: "-Djava.awt.headless=true"

jobs:
  build:
    name: Build NetManager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare Build Environment
        run: |
          # Create empty .env if not exists
          if [ ! -f ".env" ]; then
            touch .env
          fi

          # Securely provision google-services.json from GitHub Actions Secret FIREBASE_GOOGLE_SERVICES_JSON
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Successfully wrote google-services.json from secret."
          elif [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Copied google-services.json from repository root."
          else
            echo "Error: FIREBASE_GOOGLE_SERVICES_JSON secret is missing or empty, and no google-services.json file was found in the repository."
            exit 1
          fi

          # Validate that app/google-services.json is valid JSON and contains package_name com.azam.netmanager.mxrtq
          if ! jq empty app/google-services.json 2>/dev/null; then
            echo "Error: app/google-services.json is not valid JSON."
            exit 1
          fi

          if ! grep -q "com.azam.netmanager.mxrtq" app/google-services.json; then
            echo "Error: app/google-services.json does not contain the required package_name 'com.azam.netmanager.mxrtq'."
            exit 1
          fi

          echo "google-services.json validation passed successfully for package com.azam.netmanager.mxrtq."
          
          # Restore debug.keystore from base64 if available, or generate a new one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-build-cache --stacktrace -Djava.awt.headless=true

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/NetManager-Mikrotik-Manager.apk
            echo "APK ready at output/NetManager-Mikrotik-Manager.apk"
          else
            echo "Error: APK file not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetManager-APK
          path: output/NetManager-Mikrotik-Manager.apk
          retention-days: 30

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.3"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found app version: $VERSION"

      - name: Create GitHub Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/NetManager-Mikrotik-Manager.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Create or Update GitHub Release on Main Sync
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: output/NetManager-Mikrotik-Manager.apk
          name: "NetManager v${{ env.APP_VERSION }}"
          tag_name: "v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
