name: Build and Export Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dapple.awt.UIElement=true"
  GRADLE_OPTS: "-Djava.awt.headless=true"

jobs:
  build:
    name: Build NetManager APK
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare Build Environment
        run: |
          # Create empty .env if not exists
          if [ ! -f ".env" ]; then
            touch .env
          fi

          # Define the target path
          TARGET="app/google-services.json"
          
          # Source locations in order of preference
          # 1. Existing app/google-services.json
          # 2. Project root google-services.json
          # 3. Known asset path
          # 4. GitHub Action Secret
          
          if [ -f "$TARGET" ]; then
            echo "Using existing $TARGET"
          elif [ -f "google-services.json" ]; then
            cp google-services.json "$TARGET"
            echo "Copied google-services.json from root to $TARGET"
          elif [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > "$TARGET"
            echo "Provisioned $TARGET from GitHub Secret."
          else
            echo "Error: google-services.json is missing. Please ensure it is committed to the repository or added as a GitHub Secret (FIREBASE_GOOGLE_SERVICES_JSON)."
            exit 1
          fi

          # Validate that app/google-services.json is valid and matches requirements
          # project_id = netmanager25
          # package_name = com.azamfahd.netmanager.app
          
          if ! jq -e '.project_info.project_id == "netmanager25"' "$TARGET" > /dev/null; then
            echo "Error: $TARGET does not match project_id 'netmanager25'"
            exit 1
          fi

          if ! jq -e '.client[].client_info.android_client_info.package_name | select(. == "com.azamfahd.netmanager.app")' "$TARGET" > /dev/null; then
            echo "Error: $TARGET does not contain package_name 'com.azamfahd.netmanager.app'"
            exit 1
          fi

          echo "Firebase config validated successfully."

          # Restore debug.keystore from base64 if available, or generate a new one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-build-cache --stacktrace -Djava.awt.headless=true

      - name: Locate and Rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/NetManager-Mikrotik-Manager.apk
            echo "APK ready at output/NetManager-Mikrotik-Manager.apk"
          else
            echo "Error: APK file not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetManager-APK
          path: output/NetManager-Mikrotik-Manager.apk
          retention-days: 30

      - name: Extract App Version
        id: get_version
        run: |
          # Use bash to calculate the version string to ensure reliability in CI
          RUN_NUMBER=${{ github.run_number }}
          VERSION="1.4.$RUN_NUMBER"
          
          # Remove special chars and sanitize
          VERSION_SANITIZED=$(echo $VERSION | sed 's/[^a-zA-Z0-9.-]//g')
          
          echo "APP_VERSION=$VERSION_SANITIZED" >> $GITHUB_ENV
          echo "Found app version: $VERSION_SANITIZED"

      - name: Create GitHub Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/NetManager-Mikrotik-Manager.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Create or Update GitHub Release on Main Sync
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: output/NetManager-Mikrotik-Manager.apk
          name: "NetManager v${{ env.APP_VERSION }}"
          tag_name: "v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
